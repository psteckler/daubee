# Astronomy units, for the Daubee Excel add-in: the astronomical unit, the
# parsec and the light-year with prefixes, light travel times, solar and
# planetary masses and radii, the arcminute and arcsecond, the jansky, and the
# lunar distance.
#
# Add it from the Unit dictionaries dialog ("Add from URL"):
#   https://psteckler.github.io/daubee/unit-dictionaries/astronomy-units.yaml
#
# Sources: IAU 2012 Resolution B2 for the astronomical unit (exactly
# 149597870700 meters); IAU 2015 Resolution B3 for the nominal solar radius
# (6.957e8 m), solar luminosity (3.828e26 W) and equatorial Earth and Jupiter
# radii (6.3781e6 m and 7.1492e7 m); the solar, Earth and Jupiter masses
# from the IAU 2015 nominal GM values with CODATA 2018 for G (1.98841e30,
# 5.9722e24 and 1.89813e27 kg); the speed of light (299792458 m/s, exactly) for
# the light-second; the mean Earth-Moon distance (384399 km); the jansky
# (1e-26 W/(m^2 Hz)) as the IAU defines it.
#
# The light-year, parsec and year are in Excel's list (the year is the Julian
# year, 365.25 days); this dictionary adds prefixes to them, so kly, Mly, Gly,
# kpc, Mpc, Gpc, kyr, Myr and Gyr work. The solar and planetary masses, radii
# and luminosity are nominal values: they are exact only as conventions, and
# the measured quantities differ slightly. The jansky has no conversion: its
# factor to W/(m^2 Hz) can't be written as a conversion between two single
# units. Magnitudes are logarithmic and are not included.
#
# The built-in units used here are repeated exactly, so that this dictionary
# works on its own. A dictionary may repeat a unit that is already known when
# the definition is the same.

weight_and_mass:
  - canonicalName: gram
    aliases: [g, grams]
    prefixable: { metric: [g] }
  - canonicalName: kilogram
    aliases: [kg, kilograms]
    conversion: "1000 gram"

distance:
  - canonicalName: meter
    aliases: [m, meters]
    prefixable: { metric: [m] }
  - canonicalName: light_year
    aliases: [ly]
    prefixable: { metric: [ly] }
    conversion: "9460730472580800 meter"
  - canonicalName: parsec
    aliases: [pc, parsecs]
    prefixable: { metric: [pc] }
    conversion: "30856775814913673 meter"
  - canonicalName: astronomical_unit
    aliases: [au, AU, astronomical_units]
    conversion: "149597870700 meter"
  - canonicalName: light_second
    aliases: [ls, light_seconds]
    conversion: "299792458 meter"
  - canonicalName: light_minute
    aliases: [lmin, light_minutes]
    conversion: "60 light_second"
  - canonicalName: light_hour
    aliases: [lhr, light_hours]
    conversion: "3600 light_second"
  - canonicalName: light_day
    aliases: [lday, light_days]
    conversion: "86400 light_second"
  - canonicalName: lunar_distance
    aliases: [LD, lunar_distances]
    conversion: "384399000 meter"
  - canonicalName: solar_radius
    aliases: [Rsun, solar_radii]
    conversion: "6.957e8 meter"
  - canonicalName: earth_radius
    aliases: [Rearth, earth_radii]
    conversion: "6.3781e6 meter"
  - canonicalName: jupiter_radius
    aliases: [Rjup, jupiter_radii]
    conversion: "7.1492e7 meter"

time:
  - canonicalName: second
    aliases: [s, sec, seconds]
    prefixable: { metric: [s, sec] }
  - canonicalName: minute
    aliases: [mn, min, minutes]
    conversion: "60 second"
  - canonicalName: hour
    aliases: [hr, hours]
    conversion: "60 minute"
  - canonicalName: day
    aliases: [d, days]
    conversion: "24 hour"
  - canonicalName: year
    aliases: [yr, years, julian_year, julian_years]
    prefixable: { metric: [yr] }
    conversion: "365.25 day"
  - canonicalName: sol
    aliases: [sols]
    conversion: "88775.244 second"

angle:
  - canonicalName: degree
    aliases: [deg, degrees]
  - canonicalName: radian
    aliases: [rad, radians]
    conversion: "57.29577951308232 degree"
  - canonicalName: arcminute
    aliases: [arcmin, arcminutes]
    conversion: "1/60 degree"
  - canonicalName: arcsecond
    aliases: [arcsec, arcseconds]
    prefixable: { metric: [arcsec] }
    conversion: "1/3600 degree"

power:
  - canonicalName: watt
    aliases: [W, w, watts]
    prefixable: { metric: [W] }
    expansion: kg-m^2/s^3
  - canonicalName: solar_luminosity
    aliases: [Lsun, solar_luminosities]
    conversion: "3.828e26 watt"

astronomy:
  - canonicalName: solar_mass
    aliases: [Msun, solar_masses]
    conversion: "1.98841e33 gram"
  - canonicalName: earth_mass
    aliases: [Mearth, earth_masses]
    conversion: "5.9722e27 gram"
  - canonicalName: jupiter_mass
    aliases: [Mjup, jupiter_masses]
    conversion: "1.89813e30 gram"
  - canonicalName: jansky
    aliases: [Jy, janskys, janskies]
    prefixable: { metric: [Jy] }
