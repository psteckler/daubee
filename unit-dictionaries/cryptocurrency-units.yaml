# Cryptocurrency units, for the Daubee Excel add-in: the 35 largest
# cryptocurrencies by market capitalization on crypto.com/en/price (the page's
# order, on 2026-11-13), listed alphabetically by name, with their tickers and
# the usual smallest units (satoshi, wei, ...).
#
# Add it from the Unit dictionaries dialog ("Add from URL"):
#   https://psteckler.github.io/daubee/unit-dictionaries/cryptocurrency-units.yaml
#
# These are units for counting coins, not prices. They are deliberately not in
# Daubee's `currency` category: a coin has no ISO 4217 code and no currency
# number format, and none of Daubee's currency checks applies to it. There is
# no conversion between two coins, or between a coin and a currency, because
# the exchange rates change every moment: a value in BTC and a value in ETH
# can only be related by an exchange rate that you put in a cell and annotate
# with a unit ratio such as `Ethereum/Bitcoin`, as for any exchange rate.
# Wrapped Bitcoin and Tether Gold are units of their own, not Bitcoin and gold.
#
# The smallest units are fixed by each coin's protocol, so they do convert: one
# bitcoin is 100000000 satoshis, one ether 10^18 wei (10^9 gwei), one solana
# 10^9 lamports, one XRP 10^6 drops, one stellar 10^7 stroops, one hedera
# 10^8 tinybars, one monero 10^12 piconeros, one zcash 10^8 zatoshis and one
# dogecoin 10^8 koinu.
#
# The names follow the coin's usual name. Each coin has its ticker in upper
# and lower case and its name, as the currencies do. Lower-case spellings that
# would clash with other units are left out: sol (the Martian day), link (the
# surveyor's link), cc (cubic centimeter) and gram (the unit of mass), so Solana
# is SOL or solana, Chainlink is LINK, Canton Network is CC, and the Gram coin
# is GRAM (its name is Gram_Token). The market-cap list drifts, so a coin that
# has left the top 35 stays here; it is not removed.

cryptocurrency:
  # #24 by market capitalization on 2026-11-13
  - canonicalName: Avalanche
    aliases: [AVAX, avax, avalanche]
  # #1 by market capitalization on 2026-11-13
  - canonicalName: Bitcoin
    aliases: [BTC, btc, bitcoin, bitcoins]
