  - canonicalName: ton
    aliases: [tons]
    conversion: "907184.74 gram"
  - canonicalName: dram
    aliases: [drams, drachm, drachms]
    conversion: "1/16 ounce_mass"
  - canonicalName: pennyweight
    aliases: [dwt, pennyweights]
    conversion: "24 grain"
  - canonicalName: troy_ounce
    aliases: [ozt, troy_ounces]
    conversion: "480 grain"
  - canonicalName: troy_pound
    aliases: [lbt, troy_pounds]
    conversion: "5760 grain"

