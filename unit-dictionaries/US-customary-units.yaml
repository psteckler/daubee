# United States customary units (and the US survey units), for the Daubee Excel
# add-in.
#
# Add it from the Unit dictionaries dialog ("Add from URL"):
#   https://psteckler.github.io/daubee/unit-dictionaries/US-customary-units.yaml
#
# Sources: NIST Handbook 44, appendix C (general tables of units of
# measurement), and NIST Special Publication 811 (guide for the use of the
# SI). The US survey foot (1200/3937 metre) is deprecated since 2023 but
# still used in land surveys, so the survey units keep their own names
# (us_survey_foot, us_survey_mile, us_survey_acre); the plain foot, mile and
# acre are the international ones.
#
# The liquid units (the US pint, quart and gallon) are the ones Excel's
# CONVERT calls pt, qt and gal. The dry measures (dry_pint, dry_quart, peck,
# bushel) are separate units with their own names. British units that look
# similar (the imperial pint, gallon, and so on) are in the imperial
# dictionary.
#
# Many of these units are in Excel's own list and so are built in; they are
# repeated here exactly, so that this dictionary works on its own, even if the
# Excel-native groups are switched off. A dictionary may repeat a unit that is
# already known when the definition is the same, and the few units the imperial
# dictionary shares (thou, hand, fathom, dram, the troy weights, therm) are
# defined the same way in both.

distance:
  - canonicalName: meter
    aliases: [m, meters]
    prefixable: { metric: [m] }
  - canonicalName: inch
    aliases: [in, inches]
    conversion: "0.0254 meter"
  - canonicalName: foot
    aliases: [ft, feet]
    conversion: "12 inch"
  - canonicalName: yard
    aliases: [yd, yards]
    conversion: "3 foot"
  - canonicalName: mile
    aliases: [mi, miles]
    conversion: "5280 foot"
  - canonicalName: nautical_mile
    aliases: [Nmi]
    conversion: "1852 meter"
  - canonicalName: us_survey_mile
    aliases: [survey_mi]
    conversion: "6336000/3937 meter"
  - canonicalName: thou
    aliases: [mil, mils, thous]
    conversion: "1/1000 inch"
  - canonicalName: hand
    aliases: [hands]
    conversion: "4 inch"
  - canonicalName: fathom
    aliases: [fathoms]
    conversion: "6 foot"
  - canonicalName: us_survey_foot
    aliases: [survey_ft, us_survey_feet]
    conversion: "1200/3937 meter"
  - canonicalName: us_survey_chain
    aliases: [survey_chain, us_survey_chains]
    conversion: "66 us_survey_foot"
  - canonicalName: us_survey_furlong
    aliases: [survey_furlong, us_survey_furlongs]
    conversion: "660 us_survey_foot"

