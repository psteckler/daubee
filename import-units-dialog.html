<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><title>Import units</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link rel="stylesheet" href="./import-units-dialog.css"/><script defer="defer" src="import-units-dialog.js"></script></head><body><div id="dialog-box"><h1>Import units</h1><p class="dialog-note">Choose a YAML file of unit annotations, like one made by Export units. If anything in the file is wrong, nothing is imported.</p><div class="file-row"><button type="button" id="choose-file">Choose file...</button> <span id="file-name" class="file-name">No file chosen</span> <input type="file" id="file-input" accept=".yaml,.yml,.txt" hidden/></div><label class="option-row"><input type="checkbox" id="allow-overwrite"/> Allow overwrite of existing unit annotations</label> <label class="option-row"><input type="checkbox" id="choose-dictionaries"/> Choose dictionaries if needed</label><div id="import-error" class="import-error" hidden></div><div class="dialog-actions"><button id="import-button" class="primary" disabled="disabled">Import</button> <button id="cancel-button" class="secondary">Cancel</button></div></div></body></html>
