<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><title>Browse Units</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link rel="stylesheet" href="./unit-browse-dialog.css"/><script defer="defer" src="unit-browse-dialog.js"></script></head><body><div id="dialog-box"><h1>Available units</h1><p class="dialog-note">Click a unit name or alias to insert it into the formula box.</p><div id="unit-list"></div><div class="syntax-section"><span class="syntax-label">Syntax:</span> <button type="button" class="syntax-token">-</button> <button type="button" class="syntax-token">/</button> <button type="button" class="syntax-token">^</button> <button type="button" class="syntax-token">(</button> <button type="button" class="syntax-token">)</button> <button type="button" id="backspace-button" class="syntax-token syntax-action" title="Delete the last character" aria-label="Backspace">&#9003;</button></div><div class="syntax-section"><span class="syntax-label">Digits:</span> <button type="button" class="syntax-token">0</button> <button type="button" class="syntax-token">1</button> <button type="button" class="syntax-token">2</button> <button type="button" class="syntax-token">3</button> <button type="button" class="syntax-token">4</button> <button type="button" class="syntax-token">5</button> <button type="button" class="syntax-token">6</button> <button type="button" class="syntax-token">7</button> <button type="button" class="syntax-token">8</button> <button type="button" class="syntax-token">9</button> <button type="button" id="clear-button" class="syntax-token syntax-action" title="Clear the formula box">Clear</button></div><div class="dialog-actions"><button id="dialog-close" class="dialog-close">Close</button></div></div></body></html>
