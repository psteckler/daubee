<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><title>Daubee Settings</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link rel="stylesheet" href="./settings-dialog.css"/><script defer="defer" src="settings-dialog.js"></script></head><body><div id="settings-box"><h1>Settings</h1><label class="settings-row"><input type="checkbox" id="auto-apply-currency-format"/> Apply currency format when adding a currency unit</label> <label class="settings-row"><input type="checkbox" id="use-iso-code-currency-format"/> Use three-letter currency code formats by default</label> <label class="settings-row"><input type="checkbox" id="save-unit-aliases"/> Save unit aliases</label> <label class="settings-row"><input type="checkbox" id="save-inferred-units-shortest-alias"/> Save inferred and checked units using the shortest alias</label> <label class="settings-row"><input type="checkbox" id="simplify-using-unit-definitions"/> Simplify using unit definitions</label><div class="settings-row settings-row-unit-format"><label class="settings-checkbox-label"><input type="checkbox" id="auto-format-with-units"/> Autoformat with</label> <select id="unit-format-style"><option value="shortestAlias">Shortest alias</option><option value="canonical">Canonical name</option></select> <span class="settings-inline-label">Precision:</span> <select id="unit-format-precision"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select> <span class="settings-inline-label">digits</span></div><label class="settings-row"><input type="checkbox" id="define-with-unit"/> Define the WITHUNIT function in this workbook</label><p id="with-unit-status" class="settings-inline-label"></p><div class="settings-row settings-row-unit-format"><label class="settings-checkbox-label"><input type="checkbox" id="securities-unit-pin-currency" checked="checked"/> Use a specific currency for</label><details class="settings-function-list-details"><summary>securities-pricing functions</summary><p class="settings-function-list">DISC, DOLLARDE, DOLLARFR, ODDFPRICE, ODDFYIELD, ODDLPRICE, ODDLYIELD, PRICE, PRICEDISC, PRICEMAT, PV, STOCKHISTORY, TBILLPRICE, TBILLYIELD, YIELD, YIELDMAT</p></details><span class="settings-inline-label">:</span> <select id="securities-unit-iso-code"></select></div><div class="settings-row settings-row-border-style"><span class="settings-border-label">Annotation borders:</span> <select id="annotation-border-style"><option value="dashed">Dashed</option><option value="line">Line</option><option value="double">Double-line</option></select></div><div class="settings-row settings-row-border-style"><span class="settings-border-label">Error/warning borders:</span> <select id="error-border-style"><option value="dashed">Dashed</option><option value="line">Line</option><option value="double">Double-line</option></select></div><div class="settings-actions"><button id="settings-close" class="settings-close">Close</button></div></div></body></html>
