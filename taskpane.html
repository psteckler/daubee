<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><title>Daubee</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link rel="stylesheet" href="./taskpane.css"/><script defer="defer" src="taskpane.js"></script></head><body><main id="app-body" style="display: none"><div id="scroll-area"><h2 class="pane-heading">Unit actions</h2><p class="button-group-label">In sheet:</p><div class="button-row"><button id="infer-units">Infer</button> <button id="check-units">Check</button></div><p class="button-group-label">In selection:</p><div class="button-row"><button id="consolidate-units">Consolidate</button> <button id="assert-selection">Assert</button></div><section id="annotations-section"><h2 class="pane-heading">Unit annotations</h2><p>Attach an annotation to the current selection.</p><div class="annotation-label-row"><label for="annotation-text">Unit formula</label><div class="annotation-label-buttons"><button id="browse-units" type="button" class="small-button">Browse</button> <button id="clear-annotation-text" type="button" class="small-button">Clear</button></div></div><textarea id="annotation-text" rows="3" placeholder="Enter unit annotations here"></textarea> <button id="annotate-selection">Annotate selection</button> <label class="hide-borders-row"><input type="checkbox" id="hide-annotation-borders"/> Hide annotation borders</label><h3>Unit automation</h3><button id="scan-headers" disabled="disabled">Scan headers</button> <button id="wrap-dimensionless-args" class="icon-button" title="Rewrite arguments that need a unit, such as the radians in SIN(...), with WITHUNIT" disabled="disabled"><svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M1 5 H12 Q14.5 5 14.5 7.5 V10 Q14.5 12.5 12 12.5 H8 Q5.5 12.5 5.5 10 V7.5 Q5.5 5 8 5 M2.5 2.8 L4.7 5 L2.5 7.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Wrap dimensionless arguments</button> <button id="wrap-dimensionless" class="icon-button" title="Rewrite formulas whose plain-number result is in a cell annotated with a unit, with WITHUNIT" disabled="disabled"><svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M15 5 H4 Q1.5 5 1.5 7.5 V10 Q1.5 12.5 4 12.5 H8 Q10.5 12.5 10.5 10 V7.5 Q10.5 5 8 5 M12.8 2.8 L15 5 L12.8 7.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Wrap dimensionless results</button><div class="button-row"><button id="import-units" class="icon-button" title="Import unit annotations from a file" disabled="disabled"><svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 2v7M5 6.5 8 9.5l3-3M2.5 10.5v3h11v-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Import units</button> <button id="export-units" class="icon-button" title="Export unit annotations to a file" disabled="disabled"><svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 9.5v-7M5 5.5l3-3 3 3M2.5 10.5v3h11v-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Export units</button></div><h3>Units for selection</h3><button id="delete-all-in-selection" style="display: none">Delete all units within selection</button><ul id="annotation-list"></ul><h3>Errors for selection</h3><ul id="error-list"></ul></section></div><div id="status"></div></main><div id="loading">Loading...</div></body></html>
