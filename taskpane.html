<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><title>Daubee</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><link rel="stylesheet" href="./taskpane.css"/><script defer="defer" src="taskpane.js"></script></head><body><main id="app-body" style="display: none"><div id="scroll-area"><h2 class="pane-heading">Unit actions</h2><p class="button-group-label">In sheet:</p><div class="button-row"><button id="infer-units">Infer</button> <button id="check-units">Check</button></div><p class="button-group-label">In selection:</p><div class="button-row"><button id="consolidate-units">Consolidate</button> <button id="assert-selection">Assert</button></div><section id="annotations-section"><h2 class="pane-heading">Unit annotations</h2><p>Attach an annotation to the current selection.</p><div class="annotation-label-row"><label for="annotation-text">Unit formula</label><div class="annotation-label-buttons"><button id="browse-units" type="button" class="small-button">Browse</button> <button id="clear-annotation-text" type="button" class="small-button">Clear</button></div></div><textarea id="annotation-text" rows="3" placeholder="Enter unit annotations here"></textarea> <button id="annotate-selection">Annotate selection</button> <label class="hide-borders-row"><input type="checkbox" id="hide-annotation-borders"/> Hide annotation borders</label><h3>Units for selection</h3><ul id="annotation-list"></ul><button id="delete-all-in-selection" style="display: none">Delete all units within selection</button><h3>Errors for selection</h3><ul id="error-list"></ul></section></div><div id="status"></div></main><div id="loading">Loading...</div></body></html>
